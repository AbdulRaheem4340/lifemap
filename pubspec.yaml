name: lifemap
description: Your life, mapped and understood.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  get: ^4.7.3

  # --- Navigation ---
  go_router: ^18.0.1

  # --- Maps & Location ---
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^12.0.0            # Changed from 14.x (Requires SDK 34)

  # --- Local Storage ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # --- Firebase ---
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^6.2.2         # Changed from 7.x (Requires SDK 34)
  
  flutter_foreground_task: ^11.0.3


  # --- Utilities ---
  get_storage: ^2.1.1
  fl_chart: ^1.2.0
  http: ^1.6.0
  intl: ^0.20.3
  uuid: ^4.6.0
  connectivity_plus: ^6.1.0      # Changed from 7.x (Requires SDK 34)
  permission_handler: ^11.3.1    # Changed from 13.x (Requires SDK 34)
  flutter_local_notifications: ^22.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


  # --- Code Generation ---
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

assets:
    - assets/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 24